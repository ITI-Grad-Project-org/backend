name: core-api CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'coachhub/services/core-api/**'
      - '.github/workflows/ci-core-api.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'coachhub/services/core-api/**'
      - '.github/workflows/ci-core-api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coachhub/services/core-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coachhub/services/core-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests
