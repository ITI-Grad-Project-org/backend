name: coachhub

networks:
  coachhub-net:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      # Consumed by deploy/docker/create-databases.sh on first init.
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set in .env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set in .env}
    ports:
      - "5433:5432"            # host 5433 avoids clashing with a local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    networks: [coachhub-net]
    healthcheck:
      # Probing core_db (not the superuser DB) = ready only after the init
      # script created the app databases.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d core_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-coachhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "5672:5672"
      - "15672:15672"          # management UI → http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [coachhub-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Disposable cache (locked decision) — deliberately no volume.
  # NOTE: provisioned for core-api cache/sessions; app code does not consume it yet.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    networks: [coachhub-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"            # SMTP
      - "8025:8025"            # Web UI → http://localhost:8025
    networks: [coachhub-net]

  # ── Applications ───────────────────────────────────────────────────────────
  core-api:
    build:
      context: ./services/core-api
    image: ${REGISTRY:-coachhub.azurecr.io}/core-api:${IMAGE_TAG:-dev}
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dev convenience: auto-sync schema (no migrations exist yet).
      # K8s/production runs with DB_SYNCHRONIZE=false + the migration Job.
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      DATABASE_URL: postgresql://core_user:${CORE_DB_PASSWORD}@postgres:5432/core_db
      REDIS_URL: redis://redis:6379          # not consumed by the app yet
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-coachhub}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set in .env}
      # Must outlast a retried Gemini call, not just a healthy one. ai-service
      # retries 503/429 three times with backoff, so 30s now expires while the
      # answer is still coming and the socket is told it timed out.
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-120000}
      # core-api proxies the coach-facing analytics routes; analytics-service is
      # never reached by the browser directly.
      ANALYTICS_SERVICE_URL: http://analytics-service:8082
      ANALYTICS_REQUEST_TIMEOUT_MS: ${ANALYTICS_REQUEST_TIMEOUT_MS:-10000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-placeholder}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-placeholder}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-placeholder}
      AWS_S3_ACL: ${AWS_S3_ACL:-public-read}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-placeholder}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      postgres:  { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }
      redis:     { condition: service_healthy }
    networks: [coachhub-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    build:
      context: ./services/ai-service
    image: ${REGISTRY:-coachhub.azurecr.io}/ai-service:${IMAGE_TAG:-dev}
    environment:
      SERVER_PORT: 8081
      # Managed MongoDB Atlas — URI only, never an in-compose Mongo.
      SPRING_DATA_MONGODB_URI: ${MONGODB_ATLAS_URI:?set in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-coachhub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set in .env}
      # Forwarded explicitly — compose does not pass .env into the container
      # by itself. Accounts created after 2.5-flash's cutoff get a 404 for it
      # and need a 3.x model.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Knowledge-base source — same SELECT-only role analytics-service uses.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_db
      SPRING_DATASOURCE_USERNAME: analytics_user
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      RAG_INGEST_ENABLED: ${RAG_INGEST_ENABLED:-true}
      RAG_REBUILD_INDEX: ${RAG_REBUILD_INDEX:-false}
      # Default false, not true: spring-ai-mongodb-atlas-store 1.1.5's
      # IndexAlreadyExists catch only matches UncategorizedMongoDbException, but
      # Spring Data Mongo's exception translator turns that Mongo error into
      # DataIntegrityViolationException instead, so the catch never fires. With
      # this left true, the app crashes on every boot once vector_index exists —
      # not just the first one. Same fix as production (deploy/k8s/40-apps/ai-service.yaml).
      # First-ever boot against a brand-new Atlas cluster (no index yet): export
      # SPRING_AI_VECTORSTORE_MONGODB_INITIALIZE_SCHEMA=true for that one run only,
      # or create the index by hand per README §9. To add a filter field to an
      # existing index, use RAG_REBUILD_INDEX=true instead (README §9) — leave
      # this false and let RagIndexVerifier do the rebuild.
      SPRING_AI_VECTORSTORE_MONGODB_INITIALIZE_SCHEMA: ${SPRING_AI_VECTORSTORE_MONGODB_INITIALIZE_SCHEMA:-false}
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [coachhub-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  analytics-service:
    build:
      context: ./services/analytics-service
    image: ${REGISTRY:-coachhub.azurecr.io}/analytics-service:${IMAGE_TAG:-dev}
    environment:
      SERVER_PORT: 8082
      # Reads core-api's data in place (SELECT-only role). Not analytics_db —
      # Postgres cannot join across databases.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_db
      SPRING_DATASOURCE_USERNAME: analytics_user
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      JPA_DDL_AUTO: none
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-coachhub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # Analytics reads tables that core-api owns and creates on boot via
      # DB_SYNCHRONIZE. Starting before core-api has synchronised means querying
      # columns that do not exist yet, which surfaces as an opaque 500.
      core-api: { condition: service_healthy }
    networks: [coachhub-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  notification-service:
    build:
      context: ./services/notification-service
    image: ${REGISTRY:-coachhub.azurecr.io}/notification-service:${IMAGE_TAG:-dev}
    environment:
      SERVER_PORT: 8083
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-coachhub}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Default: MailHog (offline capture). Set MAIL_* in .env for real Gmail/Resend SMTP.
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@coachhub.app}
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq: { condition: service_healthy }
      mailhog:  { condition: service_started }
    networks: [coachhub-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
