# ⚠️ TEMPLATE ONLY — never put real values in this file; it is committed to git.
#
# This file lives outside the numbered apply folders on purpose, so
# `kubectl apply -f 10-config/` can never clobber your real Secret with
# placeholders.
#
# To create the REAL Secret, pick one:
#   1. (recommended) ../create-secrets.sh — builds the Secret from your local
#      .env file (gitignored), so real values never exist in the repo.
#   2. cp app-secrets.example.yaml app-secrets.local.yaml → fill values →
#      kubectl apply -f app-secrets.local.yaml   (*.local.yaml is gitignored)
#
# Real production: Sealed Secrets or External Secrets Operator backed by
# Azure Key Vault — and rotate anything that has ever been committed
# (the old Atlas URI and Gemini key in git history included).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: coachhub
type: Opaque
stringData:
  POSTGRES_SUPERUSER: "postgres"
  POSTGRES_SUPERUSER_PASSWORD: "CHANGE_ME_superuser"
  CORE_DB_USER: "core_user"
  CORE_DB_PASSWORD: "CHANGE_ME_core"
  ANALYTICS_DB_USER: "analytics_user"
  ANALYTICS_DB_PASSWORD: "CHANGE_ME_analytics"
  RABBITMQ_USER: "coachhub"
  RABBITMQ_PASSWORD: "CHANGE_ME_rabbit"
  JWT_ACCESS_SECRET: "CHANGE_ME_32_bytes_minimum_entropy"
  JWT_REFRESH_SECRET: "CHANGE_ME_32_bytes_minimum_entropy"
  GEMINI_API_KEY: "CHANGE_ME"
  MONGODB_ATLAS_URI: "mongodb+srv://USER:PASS@cluster.mongodb.net/coachhub-rag?retryWrites=true"
  # Gmail App Password (16 chars, needs 2FA on the account) — or your SMTP
  # provider's API key if you move off Gmail.
  MAIL_PASSWORD: "CHANGE_ME"
  GOOGLE_OAUTH_CLIENT_ID: "CHANGE_ME"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_S3_BUCKET: "CHANGE_ME"
