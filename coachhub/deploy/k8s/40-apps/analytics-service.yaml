# ClusterIP-only. Owns analytics_db exclusively — never touches core_db
# (read model is rebuilt from coachhub.events).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: coachhub
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001              # 'spring' user pinned in the Dockerfile
      containers:
        - name: analytics-service
          image: coachhubacr.azurecr.io/analytics-service:v1   # CI: replace with the release git SHA
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/analytics_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: ANALYTICS_DB_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: ANALYTICS_DB_PASSWORD } }
            # Hibernate owns the read-model schema until Flyway lands; 'update' is
            # additive-only. Switch to 'validate' once migrations exist.
            - name: JPA_DDL_AUTO
              value: update
            - name: SPRING_RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_HOST } }
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_USER } }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 24           # up to 2 min
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 750m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: coachhub
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 8082
      targetPort: http
