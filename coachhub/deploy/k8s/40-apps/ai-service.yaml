# ClusterIP-only (locked: never exposed via Ingress).
# MongoDB Atlas is managed — only the URI secret is injected, never an in-cluster Mongo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: coachhub
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001              # 'spring' user pinned in the Dockerfile
      containers:
        - name: ai-service
          image: coachhubacrnew123.azurecr.io/ai-service:v1   # CI: replace with the release git SHA
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATA_MONGODB_URI
              valueFrom: { secretKeyRef: { name: app-secrets, key: MONGODB_ATLAS_URI } }
            # Knowledge-base source. Reuses the analytics read-only role rather
            # than adding a second one: it already holds SELECT on every table
            # plus ALTER DEFAULT PRIVILEGES for tables core-api creates later, so
            # this needs no new grant on an existing volume — and a new role would
            # need exactly the kind of first-init-only provisioning that left
            # analytics unable to connect.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/core_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: ANALYTICS_DB_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: ANALYTICS_DB_PASSWORD } }
            - name: SPRING_RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: RABBITMQ_HOST } }
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_USER } }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: GEMINI_API_KEY } }
            # Not a secret, so it is a literal rather than a Secret key. Pinned
            # because the application.yml default (gemini-2.5-flash) 404s for any
            # Google account created after that model was retired — and the model
            # list still advertises it, so the failure reads as a bad key rather
            # than a gated one.
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash"
            - name: RAG_INGEST_ENABLED
              value: "true"
            # One-shot repair. The vector index only gains filter fields when it
            # is CREATED, so a cluster whose index predates tenant filtering must
            # rebuild it once or every search fails and the assistant silently
            # answers with no knowledge base. Set "true", roll out, confirm the
            # startup log reports the filters, then set it back to "false".
            - name: RAG_REBUILD_INDEX
              value: "false"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36           # JVM boot + Atlas handshake + RAG seed: up to 3 min
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: coachhub
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8081
      targetPort: http
