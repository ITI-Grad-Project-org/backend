apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: coachhub
  labels:
    app: analytics-service
spec:
  replicas: 1  # TODO: set production replica count
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: coachhub/analytics-service:latest  # TODO: set image tag
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: coachhub-config
            - secretRef:
                name: coachhub-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"     # TODO: tune
              memory: "256Mi" # TODO: tune
            limits:
              cpu: "500m"     # TODO: tune
              memory: "512Mi" # TODO: tune
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service-service
  namespace: coachhub
spec:
  selector:
    app: analytics-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
