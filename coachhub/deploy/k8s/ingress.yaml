apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coachhub-ingress
  namespace: coachhub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # TODO: add TLS + cert-manager annotations for production
spec:
  ingressClassName: nginx  # TODO: adjust to your cluster ingress controller
  rules:
    - host: coachhub.local  # TODO: replace with real domain
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: core-api-service
                port:
                  number: 3000
          - path: /analytics(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: analytics-service-service
                port:
                  number: 8082
