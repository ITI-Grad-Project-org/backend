apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: coachhub
  labels:
    app: ai-service
spec:
  replicas: 1  # TODO: set production replica count
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: coachhub/ai-service:latest  # TODO: set image tag
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: coachhub-config
            - secretRef:
                name: coachhub-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"     # TODO: tune
              memory: "512Mi" # TODO: tune
            limits:
              cpu: "1000m"    # TODO: tune
              memory: "1Gi"   # TODO: tune
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-service
  namespace: coachhub
spec:
  selector:
    app: ai-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
