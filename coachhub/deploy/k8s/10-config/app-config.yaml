# Non-secret configuration shared by the apps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: coachhub
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  REDIS_URL: "redis://redis:6379"
  # ⚠️ DEV ONLY. "true" = TypeORM auto-creates/alters tables from entities on boot,
  # so you don't need migration files while the schema is still changing. Auto-sync
  # can DROP columns/tables and lose data — set to "false" BEFORE any real production
  # deploy and switch to the migration Job (see docs/deployment & coachhub_migrations_gap).
  DB_SYNCHRONIZE: "true"
  # Public URLs — adjust to your real frontend domain.
  FRONTEND_URL: "https://app.coachhub.example.com"
  # Comma-separated CORS allowlist. Every browser origin that calls the API must be
  # listed exactly (scheme + host + port); wildcards are illegal on credentialed requests.
  ALLOWED_ORIGINS: "https://app.coachhub.example.com,https://uply-gamma.vercel.app,http://localhost:5173"
  # AWS S3 (media uploads)
  AWS_REGION: "us-east-1"
  AWS_S3_ACL: "public-read"
  # notification-service mail. Currently Gmail SMTP (dev/demo) — the password is a
  # Gmail App Password stored in app-secrets as MAIL_PASSWORD.
  # Gmail caps at ~500 recipients/day and sends from a personal account; switch to
  # Resend/SES for production (host smtp.resend.com, username "resend", API key).
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "ahmedhossam9226@gmail.com"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"
  # Gmail only sends as the authenticated account (or a verified alias).
  MAIL_FROM: "ahmedhossam9226@gmail.com"
