# Single Postgres instance hosting TWO logical databases (core_db, analytics_db).
# Production upgrade path: Azure Database for PostgreSQL Flexible Server —
# thanks to the two-logical-DB design that is a connection-string-only change.
apiVersion: v1
kind: Service
metadata:
  name: postgres-hl            # headless: stable per-pod DNS for the StatefulSet
  namespace: coachhub
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres               # client-facing name used in connection strings
  namespace: coachhub
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: coachhub
spec:
  serviceName: postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999                       # postgres gid in the official image
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_SUPERUSER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_SUPERUSER_PASSWORD } }
            - name: POSTGRES_DB
              value: postgres
            - name: CORE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: CORE_DB_PASSWORD } }
            - name: ANALYTICS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: ANALYTICS_DB_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdir — PVC root holds lost+found
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              # core_db existing = the init script has finished.
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d core_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi      # AKS built-in Azure Disk CSI class
        resources:
          requests:
            storage: 10Gi
