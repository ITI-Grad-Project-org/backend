# ACME issuers for cert-manager. Cluster-scoped, so they are NOT in the
# coachhub namespace — the Ingress references one by the
# `cert-manager.io/cluster-issuer` annotation.
#
# Validate with letsencrypt-staging FIRST: production allows only 5 failed
# validations per hostname per hour, which is easy to burn while debugging.
# Once a staging cert is issued, flip the Ingress annotation to letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ahmedhossam9226@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ahmedhossam9226@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
