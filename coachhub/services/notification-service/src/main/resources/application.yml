server:
  port: ${SERVER_PORT:8083}
  # Finish in-flight MQ messages / HTTP requests on SIGTERM (K8s rolling updates).
  shutdown: graceful

spring:
  application:
    name: notification-service

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:coachhub}
    password: ${SPRING_RABBITMQ_PASSWORD:secret}
    listener:
      simple:
        acknowledge-mode: auto
        # On failure, don't requeue endlessly — let retry handle it, then DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms

  mail:
    # Dev: MailHog (no auth). Prod: Resend SMTP —
    #   MAIL_HOST=smtp.resend.com MAIL_PORT=587 MAIL_USERNAME=resend
    #   MAIL_PASSWORD=<RESEND_API_KEY> MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # /actuator/health/{liveness,readiness} — used by Docker healthchecks and K8s probes.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # SMTP ping would mark the whole service DOWN when MailHog/Resend hiccups —
    # mail delivery already has MQ retry + DLQ, so keep it out of readiness.
    mail:
      enabled: false