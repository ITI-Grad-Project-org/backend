server:
  port: ${SERVER_PORT:8083}
  # Finish in-flight MQ messages / HTTP requests on SIGTERM (K8s rolling updates).
  shutdown: graceful

spring:
  application:
    name: notification-service

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:coachhub}
    password: ${SPRING_RABBITMQ_PASSWORD:secret}
    listener:
      simple:
        acknowledge-mode: auto
        # On failure, don't requeue endlessly — let retry handle it, then DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms

  mail:
    # Gmail:   MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=<you>@gmail.com
    #          MAIL_PASSWORD=<16-char app password> MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true
    #          (a normal account password will NOT work — 2FA + App Password required)
    # MailHog: MAIL_HOST=mailhog MAIL_PORT=1025, auth/starttls false.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Without these a blocked SMTP port hangs the listener thread until the
          # broker's ack timeout instead of failing fast into retry → DLQ.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

coachhub:
  mail:
    # Gmail rewrites/rejects a From it hasn't authenticated — set this to the
    # Gmail account (or a verified alias) when using Gmail SMTP.
    from: ${MAIL_FROM:no-reply@coachhub.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # /actuator/health/{liveness,readiness} — used by Docker healthchecks and K8s probes.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # SMTP ping would mark the whole service DOWN when MailHog/Resend hiccups —
    # mail delivery already has MQ retry + DLQ, so keep it out of readiness.
    mail:
      enabled: false