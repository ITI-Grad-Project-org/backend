server:
  port: ${SERVER_PORT:8082}
  # Finish in-flight MQ messages / HTTP requests on SIGTERM (K8s rolling updates).
  shutdown: graceful

spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coachhub}
    username: ${SPRING_DATASOURCE_USERNAME:coachhub}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # No Flyway/Liquibase yet, so Hibernate owns the analytics read-model schema.
      # 'update' creates/extends tables in analytics_db; switch to 'validate' once
      # a real migration tool lands.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:coachhub}
    password: ${SPRING_RABBITMQ_PASSWORD:secret}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # /actuator/health/{liveness,readiness} — used by Docker healthchecks and K8s probes.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
