server:
  port: ${SERVER_PORT:8082}
  # Finish in-flight MQ messages / HTTP requests on SIGTERM (K8s rolling updates).
  shutdown: graceful

spring:
  application:
    name: analytics-service

  # Points at core_db, NOT analytics_db: analytics reports on core-api's live
  # data and Postgres cannot join across databases. core-api owns every table
  # here; analytics_user holds SELECT and nothing else.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/core_db}
    username: ${SPRING_DATASOURCE_USERNAME:analytics_user}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Second line of defence behind the SELECT-only grants — the JDBC driver
      # rejects writes before they reach Postgres.
      read-only: true
      # core-api is the latency-sensitive workload on this instance; analytics
      # must not exhaust connections during a heavy aggregation.
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      # MUST stay 'none'. Hibernate is a reader here — 'update' would let it
      # ALTER core-api's tables to match its own mappings, and 'validate' would
      # fail startup over any column it doesn't map. TypeORM owns this schema.
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:coachhub}
    password: ${SPRING_RABBITMQ_PASSWORD:secret}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # /actuator/health/{liveness,readiness} — used by Docker healthchecks and K8s probes.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
